<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
    <!-- Taxi -->
     <a-entity class="taxi" position="0 -1 0">
      <!-- Body -->
        <!-- Bottom Base -->
        <a-box position="1.5 0.4 -1" width="4" height="0.25" depth="2" color="black"></a-box>
        <a-box position="1.5 0.88 -1" width="4" height="0.7" depth="2" color="#f0cf2e" material="metalness:0.2"></a-box>
        <!-- Fuel Cap -->
         <a-box position="2.88 0.9 -0.99" width="0.25" height="0.25" depth="2" color="#d4b115"></a-box>
         <a-box position="2.63 0.9 -0.99" width="0.25" height="0.25" depth="2" color="#d4b115"></a-box>
        <!-- Side Mirror -->
        <a-box position="0.5 1.1 -0.99" width="0.5" height="0.25" depth="2.3" color="#d4b115"></a-box>
        <!-- Pattern -->        
        <a-box position="2.38 0.65 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="1.88 0.65 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="1.38 0.65 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="0.88 0.65 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="2.13 0.9 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="1.63 0.9 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="1.13 0.9 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <a-box position="0.63 0.9 -1" width="0.25" height="0.25" depth="2.01" color="black"></a-box>
        <!-- Front - Plate & Stuff -->
        <a-box position="0.73 0.5 -1" width="2.52" height="0.1" depth="1.1" color="#9796a3"></a-box>
        <a-box position="0.75 0.66 -1" width="2.52" height="0.06" depth="1.1" color="black"></a-box>
        <a-box position="0.75 0.76 -1" width="2.52" height="0.06" depth="1.1" color="black"></a-box>
        <a-box position="0.75 0.86 -1" width="2.52" height="0.06" depth="1.1" color="black"></a-box>
        <!-- Rear Bumper Lights -->
        <a-box position="3.4 0.83 -0.4" rotation="0 90 0" width="0.3" height="0.3" depth="0.3" color="#8c140e"></a-box>
        <a-box position="3.4 0.83 -1.6" rotation="0 90 0" width="0.3" height="0.3" depth="0.3" color="#8c140e"></a-box>
        <!-- Front Lights -->
        <a-box position="-0.41 1 -0.14" rotation="0 90 0" width="0.3" height="0.3" depth="0.21" color="white"></a-box>
        <a-box position="-0.41 1 -1.86" rotation="0 90 0" width="0.3" height="0.3" depth="0.21" color="white"></a-box>
        <!-- Top Base -->
        <a-box position="1.7 1.5 -1" width="2.5" height="0.8" depth="1.7" color="#e8e6e6" material="metalness:0.2"></a-box>
        <a-box position="1.7 2 -1" width="1.5" height="0.3" depth="0.8" color="#f0cf2e"></a-box>
        <!-- Windows -->
        <a-box position="1.7 1.5 -1" width="2.52" height="0.5" depth="1.3" color="black"></a-box>
        <a-box position="1.3 1.5 -1" rotation="0 90 0" width="1.72" height="0.5" depth="1.3" color="black"></a-box>
        <a-box position="2.5 1.5 -1" rotation="0 90 0" width="1.72" height="0.5" depth="0.3" color="black"></a-box>
      <!-- Wheels -->

        <a-entity class="tires">
        <!-- Front Right Wheel -->
        <a-entity class="wheel">
          <a-cylinder position="0.2 0.4 0" rotation="90 0 0" radius="0.2" height="0.45"></a-cylinder>
          <a-cylinder position="0.2 0.4 0" rotation="90 0 0" radius="0.4" height="0.42" color="black"></a-cylinder>
        </a-entity>
        <!-- Front Left Wheel -->
         <a-entity class="wheel">
          <a-cylinder position="0.2 0.4 -2" rotation="90 0 0" radius="0.2" height="0.45"></a-cylinder>
          <a-cylinder position="0.2 0.4 -2" rotation="90 0 0" radius="0.4" height="0.42" color="black"></a-cylinder>
        </a-entity>
        <!-- Back Right Wheel -->
        <a-entity class="wheel">
          <a-cylinder position="2.9 0.4 -2" rotation="90 0 0" radius="0.2" height="0.45"></a-cylinder>
          <a-cylinder position="2.9 0.4 -2" rotation="90 0 0" radius="0.4" height="0.42" color="black"></a-cylinder>
        </a-entity>
        <!-- Back Left Wheel -->
        <a-entity class="wheel">
          <a-cylinder position="2.9 0.4 0" rotation="90 0 0" radius="0.2" height="0.45"></a-cylinder>
          <a-cylinder position="2.9 0.4 0" rotation="90 0 0" radius="0.4" height="0.42" color="black"></a-cylinder>
        </a-entity>
      </a-entity>
    </a-entity>
      <!-- Pavement -->
      <!-- <a-box position="0 0 0" width="5" height="0.2" color="gray"></a-box> -->

      <!-- Background -->
      <a-plane position="0 -2 0" rotation="-90 0 0" width="10" height="10" color="#54734c"></a-plane>
      <a-sky color="blue"></a-sky>
      
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
