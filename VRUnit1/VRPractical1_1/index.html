<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="0 .5 0" rotation="0 45 0" color="#e096db"></a-box>

      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>

      <a-cylinder position="0 0 0" radius="3" height="0.2" color="gray"></a-cylinder>

      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#54734c"></a-plane>

      <a-sky color="#ECECEC"></a-sky>
      
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
