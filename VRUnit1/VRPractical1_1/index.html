<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Body -->
      <a-box wireframe=true position="0 0.5 0" width="3" height=""></a-box>
      <!-- Wheels -->
      <!-- Front Right Wheel -->
      <a-entity class="wheel" rotation="0 90 0">
        <a-box position="0 0.4 0" width="0.5" height="0.5" depth="0.5" color="black"></a-box>
        <a-box position="0 0.4 0" width="0.52" height="0.25" depth="0.25" color="white"></a-box>
      </a-entity>
      <!-- Front Left Wheel -->
      <a-entity class="wheel" rotation="0 90 0">
        <a-box position="2 0.4 0" width="0.5" height="0.5" depth="0.5" color="black"></a-box>
        <a-box position="2 0.4 0" width="0.52" height="0.25" depth="0.25" color="white"></a-box>
      </a-entity>
      <!-- Back Right Wheel -->
       <a-entity class="wheel" rotation="0 90 0">
        <a-box position="2 0.4 3" width="0.5" height="0.5" depth="0.5" color="black"></a-box>
        <a-box position="2 0.4 3" width="0.52" height="0.25" depth="0.25" color="white"></a-box>
      </a-entity>

      <a-box position="0 0 0" width="5" height="0.2" color="gray"></a-box>

      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#54734c"></a-plane>

      <a-sky color="#ECECEC"></a-sky>
      
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
